<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bet Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F6; --surface:#FFFFFF; --raised:#FAFBFC;
    --ink:#15181C; --ink2:#586069; --ink3:#98A0AA;
    --line:#E6E9ED; --line2:#EFF1F4; --accent:#5A52E0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:760px;margin:0 auto;padding:26px 18px 72px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .mark{font-family:Archivo,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .datechip{font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);
    padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .caption{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .btn{font-family:Inter,sans-serif;font-size:13px;font-weight:500;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:8px 13px;border-radius:9px;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--raised);border-color:#DADEE3}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#4A43C8;border-color:#4A43C8}
  .lead{margin:10px 0 0;font-size:13px;color:var(--ink2)}
  .note{margin-top:16px;padding:11px 14px;border-radius:11px;font-size:13.5px;line-height:1.5;border:1px solid}
  .note strong{font-weight:600}
  .note-load{background:var(--surface);border-color:var(--line);color:var(--ink2);display:flex;gap:9px;align-items:center}
  .note-warn{background:#FBF4E4;border-color:#F0DEB0;color:#7A5A12}
  .note-error{background:#FBECEF;border-color:#F2CAD2;color:#9D2740}
  .summary{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(20,24,28,.03);padding:15px 16px}
  .summary-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .summary-title{font-family:Archivo,sans-serif;font-weight:700;font-size:16px;letter-spacing:-.01em}
  .summary-meta{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .summary-sub{margin-top:6px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px}
  .lg{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
  .board{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .game{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(20,24,28,.03);overflow:hidden}
  .game-head{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;
    background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .game-head:hover{background:var(--raised)}
  .gh-left{flex:1;min-width:0}
  .teams{font-family:Archivo,sans-serif;font-weight:700;font-size:15.5px;color:var(--ink)}
  .teams .at{color:var(--ink3);font-weight:600;margin:0 5px}
  .gstate{margin-top:3px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .live-tag{display:inline-flex;align-items:center;gap:5px;font-family:Inter,sans-serif;font-size:10.5px;
    font-weight:700;letter-spacing:.06em;color:#D03A52;margin-right:9px}
  .live-tag .ld{width:7px;height:7px;border-radius:50%;background:#D03A52}
  .minidots{display:flex;gap:4px;margin-top:9px}
  .minidots .dot{width:7px;height:7px}
  .score{font-family:Archivo,sans-serif;font-weight:700;font-size:18px;color:var(--ink);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .score.final{color:var(--ink3)}
  .diamond-wrap{display:flex;align-items:center;flex-shrink:0;margin-right:2px}
  .diamond circle{transition:fill .3s}
  .diamond circle.on{filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 1px var(--accent))}
  .matchup{margin-top:3px;font-size:11.5px;color:var(--ink2)}
  .chev{flex-shrink:0;color:var(--ink3);transition:transform .2s;display:flex}
  .game-body{padding:2px 16px 12px;border-top:1px solid var(--line2)}
  .leg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
  .leg:last-child{border-bottom:0}
  .leg-main{flex:1;min-width:0}
  .player{font-weight:600;font-size:14.5px}
  .prop{margin-top:2px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .slips{margin-top:2px;font-size:11.5px;color:var(--ink3)}
  .leg-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;max-width:52%}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:999px;white-space:nowrap}
  .chip .dot{width:7px;height:7px}
  .leg-detail{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right}
  .feed-wrap{margin-top:28px}
  .feed-head{font-family:Archivo,sans-serif;font-weight:700;font-size:13px;color:var(--ink2);margin-bottom:6px}
  .feed-item{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line2);align-items:flex-start}
  .feed-badge{margin-top:1px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    min-width:30px;height:20px;padding:0 6px;border-radius:6px;font-family:Archivo,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.02em}
  .feed-badge.pulse{animation:pulse 1.5s ease-in-out infinite}
  .feed-txt{font-size:13.5px;color:var(--ink)}
  .feed-txt b{font-weight:600}
  .feed-sub{margin-top:2px;font-size:12px;color:#5B6472;font-variant-numeric:tabular-nums}
  .feed-time{font-size:11px;color:var(--ink3);white-space:nowrap;flex-shrink:0;margin-top:2px;font-variant-numeric:tabular-nums}
  .feed-sort{display:inline-flex;gap:4px;margin:14px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
  .feed-sort button{font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;border:0;background:none;color:var(--ink2);padding:6px 13px;border-radius:7px;transition:background .15s,color .15s}
  .feed-sort button:hover{color:var(--ink)}
  .feed-sort button.is-active{background:var(--accent);color:#fff}
  .feed-filter{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .feed-filter button{display:inline-flex;align-items:center;gap:6px;font-family:Inter,sans-serif;font-size:12.5px;font-weight:600;
    cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink3);padding:6px 13px;border-radius:999px;
    transition:background .15s,border-color .15s,color .15s}
  .feed-filter button .fdot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;transition:opacity .15s}
  .feed-filter button.is-active{color:var(--ink);border-color:#DADEE3;background:var(--raised)}
  .feed-filter button.is-active .fdot{opacity:1}
  .feed-filter button[data-filter="mine"].is-active{color:#1D4ED8;border-color:#C7D6FB;background:#E9F0FE}
  .feed-filter button[data-filter="hr"].is-active{color:#15784A;border-color:#BFE3CE;background:#E6F4EC}
  .feed-filter button[data-filter="sb"].is-active{color:#946410;border-color:#EED9A0;background:#FBF1DB}
  .feed-filter button[data-filter="allnfl"].is-active{color:#5A52E0;border-color:#D4D1F7;background:#EEEDFC}
  .ag-wrap{margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .ag-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:var(--raised);border-bottom:1px solid var(--line2)}
  .ag-title{font-family:Archivo,sans-serif;font-weight:700;font-size:14px}
  .ag-count{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .ag-body{padding:0 14px}
  .ag-item{padding:11px 0;border-bottom:1px solid var(--line2)}
  .ag-item:last-child{border-bottom:0}
  .ag-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ag-score{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .ag-score .pos{color:var(--accent)}
  .ag-clock{font-size:12px;font-weight:600;color:#D03A52;font-variant-numeric:tabular-nums}
  .ag-dd{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .ag-rz{font-size:10.5px;font-weight:700;color:#B42D45;background:#FBE8EC;padding:1px 6px;border-radius:5px}
  .ag-play{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
  .ag-text{font-size:13px;color:var(--ink);line-height:1.4}
  .ag-mine{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:#1D4ED8;background:#E9F0FE;padding:1px 6px;border-radius:5px;vertical-align:1px}
  .ag-empty{padding:16px 0;font-size:13px;color:var(--ink3);text-align:center}
  .feed-badge-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .mybets{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .section-label{font-family:Archivo,sans-serif;font-weight:700;font-size:11px;color:var(--ink3);
    letter-spacing:.06em;text-transform:uppercase;margin:10px 2px 0}
  .mybet-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(20,24,28,.03);padding:13px 16px}
  .mybet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .mybet-main{flex:1;min-width:0}
  .mybet-game{margin-top:4px;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .mybet-bar{margin-top:11px;height:5px;border-radius:999px;background:var(--line2);overflow:hidden}
  .mybet-bar-fill{height:100%;border-radius:999px;transition:width .3s}
  .parlay{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 1px 2px rgba(20,24,28,.03);padding:13px 16px}
  .parlay-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .parlay-name{font-family:Archivo,sans-serif;font-weight:700;font-size:14.5px}
  .parlay-name .odds{color:var(--accent);margin-left:6px}
  .parlay-money{margin-top:2px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .parlay-legs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .pleg{display:flex;align-items:center;gap:9px;font-size:13px}
  .pleg-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pleg-name span{color:var(--ink2)}
  .pleg-st{font-size:11.5px;font-weight:600;white-space:nowrap}
  .feed-layout{display:flex;gap:0;align-items:flex-start}
  .col-resizer{width:14px;flex-shrink:0;cursor:col-resize;position:relative;align-self:stretch;touch-action:none}
  .col-resizer::after{content:"";position:absolute;top:8px;bottom:8px;left:6px;width:2px;background:var(--line);border-radius:2px;transition:background .15s}
  .col-resizer:hover::after,.col-resizer.dragging::after{background:var(--accent)}
  .feed-layout:has(.col-collapsed) .col-resizer{display:none}
  @media (max-width:680px){ .col-resizer{display:none} }
  .feed-main{flex:1;min-width:0;transition:flex-basis .2s}
  .feed-main.col-collapsed{flex:0 0 44px;overflow:hidden}
  .feed-main.col-collapsed #feed{display:none}
  .props-sidebar{width:196px;flex:0 0 196px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:13px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;transition:flex-basis .2s,width .2s}
  .props-sidebar.col-collapsed{flex:0 0 44px;width:44px;overflow:hidden;max-height:44px}
  .props-sidebar.col-collapsed #propsSidebar{display:none}
  .feed-layout:has(.feed-main.col-collapsed) .props-sidebar{flex:1 1 auto;width:auto}
  .feed-layout:has(.props-sidebar.col-collapsed) .feed-main{flex:1 1 auto}
  .feed-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
  .col-collapsed .feed-col-head{justify-content:center}
  .col-collapsed .feed-col-title,.col-collapsed .props-sidebar-title{display:none}
  .col-toggle{background:none;border:1px solid var(--line);color:var(--ink2);width:26px;height:26px;
    border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
  .col-toggle:hover{background:var(--raised)}
  .col-toggle svg{transition:transform .2s}
  .feed-col-title{font-family:Archivo,sans-serif;font-weight:700;font-size:11px;color:var(--ink3);
    letter-spacing:.06em;text-transform:uppercase}
  .props-sidebar-title{font-family:Archivo,sans-serif;font-weight:700;font-size:11px;color:var(--ink3);
    letter-spacing:.06em;text-transform:uppercase}
  .ps-item{padding:8px 0;border-bottom:1px solid var(--line2)}
  .ps-item:last-child{border-bottom:0}
  .ps-player{font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.25}
  .ps-prop{font-size:11px;color:var(--ink2);margin-top:1px}
  .ps-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px}
  .ps-chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0}
  .ps-detail{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:680px){
    .feed-layout{flex-direction:column}
    .props-sidebar{width:100%;position:static;max-height:none}
    .feed-main.col-collapsed,.props-sidebar.col-collapsed{flex-basis:auto;width:100%;max-height:none}
  }
  .feed-flat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
  .feed-flat .feed-item:last-child{border-bottom:0}
  .feed-game-tag{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.01em}
  .feed-group{margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .feed-group-head{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--raised);border-bottom:1px solid var(--line2)}
  .feed-group-head .teams{font-size:14px}
  .feed-group-body{padding:0 14px}
  .feed-group-body .feed-item:last-child{border-bottom:0}
  .fg-score{margin-left:auto;font-family:Archivo,sans-serif;font-weight:700;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .feed-item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-left:auto;flex-shrink:0}
  .hdr-toggle{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .hdr-toggle svg{transition:transform .2s}
  body.hdr-collapsed .lead,body.hdr-collapsed #banner{display:none}
  body.hdr-collapsed .top{padding-bottom:2px}
  body.hdr-collapsed .mark{font-size:16px}
  body.hdr-collapsed .datechip{font-size:11px;padding:1px 7px}
  body.hdr-collapsed .wrap{padding-top:16px}
  body.hdr-collapsed #expandBtn{display:none}
  body.hdr-collapsed #refreshBtn{padding:5px 10px;font-size:12px}
  body.hdr-collapsed .caption{font-size:11px}
  body.hdr-collapsed .tabs{margin-top:8px;padding:2px}
  body.hdr-collapsed .tab{padding:5px 12px;font-size:12px}
  .fantasy{margin-top:14px;display:flex;flex-direction:column;gap:12px}
  .fx-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
  .fx-bar b{color:var(--ink);font-weight:600}
  .fx-link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
  .fx-setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
  .fx-setup h3{margin:0 0 4px;font-family:Archivo,sans-serif;font-size:16px}
  .fx-setup p{margin:0 0 12px;font-size:13px;color:var(--ink2)}
  .fx-form{display:flex;gap:8px}
  .fx-form input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--raised);color:var(--ink)}
  .fx-form input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .fx-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(20,24,28,.03);overflow:hidden}
  .fx-head{padding:13px 16px 12px;border-bottom:1px solid var(--line2)}
  .fx-league{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;font-family:Archivo,sans-serif}
  .fx-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-top:8px}
  .fx-team{min-width:0}
  .fx-team.r{text-align:right}
  .fx-tname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx-rec{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .fx-pts{font-family:Archivo,sans-serif;font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
  .fx-pts.lead{color:#15784A}
  .fx-vs{font-size:11px;color:var(--ink3);font-weight:600;padding-bottom:8px}
  .fx-meter{margin-top:10px;height:5px;border-radius:999px;background:#F2CAD2;overflow:hidden}
  .fx-meter div{height:100%;background:#1E9E5A;border-radius:999px;transition:width .3s}
  .fx-meta{margin-top:7px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .fx-rows{padding:2px 12px 8px}
  .fx-row{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line2)}
  .fx-row:last-child{border-bottom:0}
  .fx-slot{font-size:10px;font-weight:700;color:var(--ink3);text-align:center;letter-spacing:.03em}
  .fx-p{display:flex;align-items:center;gap:8px;min-width:0}
  .fx-p.r{flex-direction:row-reverse;text-align:right}
  .fx-pinfo{min-width:0;flex:1}
  .fx-pname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx-psub{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .fx-psub .lv{color:#D03A52;font-weight:600}
  .fx-ppts{font-family:Archivo,sans-serif;font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:36px}
  .fx-p.r .fx-ppts{text-align:left}
  .fx-p:not(.r) .fx-ppts{text-align:right}
  .fx-ppts.pre{color:var(--ink3);font-weight:600}
  .fx-empty{color:var(--ink3);font-size:12.5px;font-style:italic}
  .fx-bench{padding:9px 16px 12px;border-top:1px solid var(--line2);font-size:12px;color:var(--ink2)}
  .fx-bench summary{cursor:pointer;font-weight:600;color:var(--ink2)}
  .fx-bench-list{margin-top:6px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
  .fx-bench-list div{display:flex;justify-content:space-between;gap:10px}
  @media (max-width:420px){ .fx-pts{font-size:24px} .fx-pname{font-size:12.5px} .fx-rows{padding:2px 8px 8px} }

function propLabel(kind){ return (KIND_META[kind]&&KIND_META[kind].label)||String(kind).toUpperCase(); }
function propName(kind){ return (KIND_META[kind]&&KIND_META[kind].name)||kind; }

/* games in date + start-time order (handles a.m. kickoffs too) */
function parseStart(s){ const m=String(s).match(/(\d+):(\d+)\s*([ap])/i); if(!m) return 9999; let h=+m[1]; const ap=m[3].toLowerCase();
  if(ap==="p"&&h<12)h+=12; if(ap==="a"&&h===12)h=0; return h*60+(+m[2]); }
function gameDate(label){ return (GAME_META[label]&&GAME_META[label].date)||EFFECTIVE_DATE; }
function sortKey(game,start){ return gameDate(game)+"|"+String(parseStart(start)).padStart(4,"0"); }
const GAME_ORDER = (()=>{ const seen={},arr=[]; BETS.forEach(b=>{ if(!seen[b.game]){seen[b.game]=1;arr.push({game:b.game,start:b.start});} });
  arr.sort((a,b)=>sortKey(a.game,a.start)<sortKey(b.game,b.start)?-1:1); return arr.map(x=>x.game); })();
function gameSport(label){ return (GAME_META[label]&&GAME_META[label].sport)||"mlb"; }
const HAS_MLB = GAME_ORDER.some(g=>gameSport(g)==="mlb");

const INITIAL_LIVE = Object.fromEntries(BETS.map(b=>[b.id,{current:0,status:"pregame",detail:"",gameState:"Starts "+b.start+" ET"}]));

/* state */

let prevStatus = Object.fromEntries(Object.entries(INITIAL_LIVE).map(([k,v])=>[k,v.status]));

let openGames={}, userSet={}, playFeed=[], lastUpdated=null, autoOn=true, activeTab="board", feedSort="game";

/* helpers */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(n){ return "$"+Number(n).toFixed(2).replace(/\.00$/,""); }
function tally(list){ let hit=0,dead=0,liveN=0,pend=0; list.forEach(b=>{ const s=(live[b.id]||{}).status;
  if(s==="cleared")hit++; else if(s==="busted")dead++; else if(s==="on_track"||s==="behind"||s==="final")liveN++; else pend++; }); return {hit,dead,liveN,pend}; }
function getOpen(game){ if(game in userSet) return !!openGames[game]; return false; }

function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim(); }
function numFrom(v){ if(v==null||v==="") return 0; const m=String(v).match(/^(-?\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):0; }

/* ===== shared status logic ===== */
function computeStatus(kind,val,line,state,lateGame,period){
  if(state==="pregame")return "pregame";
  if(kind==="q1_rec_yds"){
    if(val>line) return "cleared";
    if(state==="final"||(period||0)>=2) return "busted";
    return "on_track";
  }
  if(state==="final")return val>line?"cleared":"busted";
  if(val>line)return "cleared";
  if(kind==="sb"||kind==="hr")return "on_track";
  return (lateGame && val<line)?"behind":"on_track";
}

async function fetchJSON(url){ const r=await fetch(url,{headers:{"Accept":"application/json"}}); if(!r.ok) throw new Error("http "+r.status); return r.json(); }

/* ===== MLB free data layer (statsapi.mlb.com) ===== */
const MLB_SCHED_URL = d => "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date="+d;
const MLB_FEED_URL = pk => "https://statsapi.mlb.com/api/v1.1/game/"+pk+"/feed/live";
async function loadMLBSchedule(date){ const j=await fetchJSON(MLB_SCHED_URL(date)); const out=[]; (j.dates||[]).forEach(d=>(d.games||[]).forEach(g=>out.push(g))); return out; }
function matchMLBGame(sched,meta){ const ma=norm(meta.away),mh=norm(meta.home);
  return sched.find(g=>{ const a=norm(g.teams.away.team.name),h=norm(g.teams.home.team.name);
    return (a.includes(ma)||ma.includes(a))&&(h.includes(mh)||mh.includes(h)); }); }
function findPlayer(pmap,name){ const n=norm(name); if(pmap[n])return n; const ks=Object.keys(pmap);
  let k=ks.find(x=>x===n); if(k)return k; k=ks.find(x=>x.includes(n)||n.includes(x)); return k||null; }
function batting(b){ const g=k=>(+b[k]||0);
  const hits=g("hits"),d=g("doubles"),t=g("triples"),hr=g("homeRuns"),rbi=g("rbi"),r=g("runs"),bb=g("baseOnBalls"),hbp=g("hitByPitch"),sb=g("stolenBases"),ab=g("atBats");
  const singles=Math.max(0,hits-d-t-hr);
  const fs=singles*3+d*5+t*8+hr*10+rbi*2+r*2+bb*2+hbp*2+sb*5;
  return {hits,d,t,hr,rbi,r,bb,hbp,sb,ab,fs}; }
function statLine(pmap,name,kind){
  const key=findPlayer(pmap,name); if(!key) return "";
  const c=batting(pmap[key]); const parts=[c.hits+"-for-"+c.ab];
  if(c.hr)parts.push(c.hr+" HR"); if(c.rbi)parts.push(c.rbi+" RBI");
  if(c.sb)parts.push(c.sb+" SB"); if(c.bb)parts.push(c.bb+" BB");
  if(kind==="fs")parts.push("FS "+c.fs);
  return parts.join(", ");
}
function inningLabel(ab){ if(!ab) return ""; const h=ab.halfInning; return (h?(h==="top"?"Top ":"Bot "):"")+(ab.inning||""); }
function eventDot(ev){ ev=(ev||"").toLowerCase();
  if(/strikeout|grounded into|double play|out|error|caught stealing|fielders choice|pop|flied|lined|sac/.test(ev)) return "#D03A52";
  if(/home run|triple|double|single|hit by pitch|walk|stolen base|hit/.test(ev)) return "#1E9E5A";
  return "#A6AEB8";
}
function eventBadge(ev){ const e=(ev||"").toLowerCase();
  if(/home run/.test(e)) return {label:"HR",fg:"#15784A",bg:"#E6F4EC"};
  if(/triple/.test(e)) return {label:"3B",fg:"#15784A",bg:"#E6F4EC"};
  if(/double play/.test(e)) return {label:"DP",fg:"#B42D45",bg:"#FBE8EC"};
  if(/double/.test(e)) return {label:"2B",fg:"#15784A",bg:"#E6F4EC"};
  if(/single/.test(e)) return {label:"1B",fg:"#15784A",bg:"#E6F4EC"};
  if(/stolen base/.test(e)) return {label:"SB",fg:"#1D4ED8",bg:"#E9F0FE"};
  if(/caught stealing/.test(e)) return {label:"CS",fg:"#B42D45",bg:"#FBE8EC"};
  if(/hit by pitch/.test(e)) return {label:"HBP",fg:"#946410",bg:"#FBF1DB"};
  if(/walk/.test(e)) return {label:"BB",fg:"#946410",bg:"#FBF1DB"};
  if(/strikeout/.test(e)) return {label:"K",fg:"#B42D45",bg:"#FBE8EC"};
  if(/grounded into|error|fielders choice|pop|flied|lined|sac|out/.test(e)) return {label:"OUT",fg:"#B42D45",bg:"#FBE8EC"};
  return {label:"•",fg:"#586069",bg:"#EFF1F4"};
}
function relTime(iso){ if(!iso) return ""; const t=new Date(iso).getTime(); if(isNaN(t)) return "";
  const diff=Math.round((Date.now()-t)/60000);

function matchESPNGame(events,meta){
  const ma=norm(meta.away), mh=norm(meta.home);

    const comp=(ev.competitions&&ev.competitions[0])||{}; const cs=comp.competitors||[];
    const home=cs.find(c=>c.homeAway==="home"), away=cs.find(c=>c.homeAway==="away");

    const madeAt=key=>{ const i=idx[key]; if(i==null) return 0; const v=stats[i]; if(!v) return 0; const m=String(v).match(/^(\d+)/); return m?parseInt(m[1],10):0; };

function abbrRegex(name){

  const first=toks.shift()||""; const ini=first.replace(/[^A-Za-z]/g,"").charAt(0);

  if(/field goal good/.test(ty)||/field goal is good/.test(t)) return {label:"FG",fg:"#15784A",bg:"#E6F4EC"};
  if(/field goal/.test(ty)||/field goal/.test(t)) return {label:"FG X",fg:"#B42D45",bg:"#FBE8EC"};
  if(/intercept/.test(ty+t)) return {label:"INT",fg:"#B42D45",bg:"#FBE8EC"};
  if(/fumble/.test(ty+t)) return {label:"FUM",fg:"#B42D45",bg:"#FBE8EC"};
  if(/sack/.test(ty)) return {label:"SACK",fg:"#B42D45",bg:"#FBE8EC"};

  if(!plays.length){ buildScoringFeedESPN(label,"nfl",sum,boxPlayers); return; }
  const people={}; legs.forEach(b=>{ if(!people[b.player]) people[b.player]={re:abbrRegex(b.player),bet:b}; });

  if(!Object.keys(mine).length) return;

    const ath=a.athlete||{}; if(ath.id!=null && ath.displayName) idToName[String(ath.id)]=ath.displayName; }); }); });

      seen[pid]=1;
      const ctxParts=[]; if(pl.period) ctxParts.push("Q"+(pl.period.number||pl.period));
      const clockTxt=typeof pl.clock==="number"?formatClock(pl.clock):((pl.clock&&pl.clock.displayValue)||"");
      if(clockTxt) ctxParts.push(clockTxt);
      const badge=espnEventBadge(sport,(pl.type&&pl.type.text)||(pl.playType&&pl.playType.text)||pl.text);
      playFeed.push({ ts: pl.wallclock || ("e"+label+(pl.id||pl.sequenceNumber||nm)),
        key: label+"|espn|"+(pl.id||pl.sequenceNumber||nm), game: label, betId: bet.id, when: pl.wallclock||null, cats:["mine"],
        player: nm, event: pl.shortText||pl.text||badge.label, ctx: ctxParts.filter(Boolean).join(" · "),
        line: (live[bet.id]&&live[bet.id].detail)||"", badgeOverride: badge });
    });
  });
}

/* ===== ALL GAMES live feed — every NFL game in progress + its most recent play.
   One request to ESPN's current-week scoreboard (it carries situation.lastPlay), only while the toggle is on. */
let allNFL={games:[],next:null,loaded:false,at:null};
async function refreshAllGames(){
  if(!feedFilters.allnfl) return;
  try{
    const j=await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
    const evs=j.events||[]; const out=[]; let next=null;
    evs.forEach(ev=>{
      const comp=(ev.competitions&&ev.competitions[0])||{}; const st=ev.status||{}; const type=st.type||{};
      if(type.state==="pre"){ const t=new Date(ev.date).getTime(); if(!isNaN(t)&&(!next||t<next.t)) next={t,name:ev.shortName||ev.name}; return; }
      if(type.state!=="in") return;
      const cs=comp.competitors||[]; const home=cs.find(c=>c.homeAway==="home")||{}, away=cs.find(c=>c.homeAway==="away")||{};
      const sit=comp.situation||{}; const lp=sit.lastPlay||{};
      const posId=String(sit.possession||"");
      out.push({ id:ev.id, start:ev.date,
        away:(away.team&&away.team.abbreviation)||"", home:(home.team&&home.team.abbreviation)||"",
        awayId:String((away.team&&away.team.id)||""), homeId:String((home.team&&home.team.id)||""),
        aScore:away.score||"0", hScore:home.score||"0", pos:posId,
        clock:type.shortDetail||("Q"+st.period+" "+(st.displayClock||"")),
        dd:sit.downDistanceText||sit.shortDownDistanceText||"", rz:!!sit.isRedZone,
        text:lp.text||"", ptype:lp.type||null });
    });
    out.sort((a,b)=>a.start<b.start?-1:(a.start>b.start?1:(a.away<b.away?-1:1)));
    allNFL={games:out,next,loaded:true,at:new Date()};
  }catch(_){ allNFL.loaded=true; }
  render();
}
let MY_NAME_RES=null;
function mentionsMine(text){
  if(!MY_NAME_RES) MY_NAME_RES=[...new Set(BETS.map(b=>b.player))].map(abbrRegex).filter(Boolean);
  return MY_NAME_RES.some(re=>re.test(text));
}
function buildAllGamesHTML(){
  const head=t=>'<div class="ag-wrap"><div class="ag-head"><span class="ag-title">All live NFL games</span><span class="ag-count">'+t+'</span></div><div class="ag-body">';
  if(!allNFL.loaded) return head("loading…")+'<div class="ag-empty"><span class="spin">↻</span> Pulling every live game…</div></div></div>';
  if(!allNFL.games.length){
    let msg="No NFL games live right now.";
    if(allNFL.next){ try{ msg+=" Next: "+esc(allNFL.next.name)+", "+new Date(allNFL.next.t).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit",timeZone:"America/New_York"})+" ET."; }catch(_){} }
    return head("0 live")+'<div class="ag-empty">'+msg+'</div></div></div>';
  }
  const items=allNFL.games.map(g=>{
    const aPos=g.pos&&g.pos===g.awayId, hPos=g.pos&&g.pos===g.homeId;
    const score='<span class="ag-score">'+(aPos?'<span class="pos">▸</span>':'')+esc(g.away)+' '+esc(g.aScore)+' <span style="color:var(--ink3)">@</span> '+esc(g.home)+' '+esc(g.hScore)+(hPos?'<span class="pos">◂</span>':'')+'</span>';
    const badge=g.text?nflPlayBadge({type:g.ptype,text:g.text},false):{label:"•",fg:"#586069",bg:"#EFF1F4"};
    const mine=g.text&&mentionsMine(g.text);
    return '<div class="ag-item"><div class="ag-top">'+score+'<span class="ag-clock">'+esc(g.clock)+'</span>'+
      (g.dd?'<span class="ag-dd">'+esc(g.dd)+'</span>':'')+(g.rz?'<span class="ag-rz">RED ZONE</span>':'')+'</div>'+
      '<div class="ag-play"><span class="feed-badge" style="background:'+badge.bg+';color:'+badge.fg+'">'+esc(badge.label)+'</span>'+
      '<span class="ag-text">'+(g.text?esc(cleanPlayText(g.text)):'<span style="color:var(--ink3)">Waiting for the first play…</span>')+(mine?'<span class="ag-mine">YOUR PLAYER</span>':'')+'</span></div></div>';
  }).join("");
  return head(allNFL.games.length+" live")+items+'</div></div>';
}

/* ===== SLEEPER FANTASY (free public API, api.sleeper.app — no key, no Claude usage) =====

const SLEEPER_USERNAME = "mikerold92";
const SLP = "https://api.sleeper.app/v1";
const SLOT_LABEL = {QB:"QB",RB:"RB",WR:"WR",TE:"TE",K:"K",DEF:"DST",FLEX:"FLX",SUPER_FLEX:"SF",REC_FLEX:"W/T",WRRB_FLEX:"W/R",IDP_FLEX:"IDP",DL:"DL",LB:"LB",DB:"DB"};
const NON_START = new Set(["BN","IR","TAXI"]);
function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(_){ return false; } }
let sleeperName = lsGet("sleeperUser") || SLEEPER_USERNAME;
let fant = { user:null, season:null, week:null, leagues:[], meta:{}, matchups:{}, players:null, teamState:{}, err:null, metaAt:0, loadedOnce:false, busy:false };

async function loadSleeperPlayers(){
  if(fant.players) return fant.players;
  const key="slpPlayers_v1";
  try{ const c=JSON.parse(lsGet(key)||"null"); if(c&&c.d===todayET()&&c.m){ fant.players=c.m; return c.m; } }catch(_){}
  const all=await fetchJSON(SLP+"/players/nfl"); const m={};
  const keep=new Set(["QB","RB","WR","TE","K","DEF","DL","LB","DB","FB"]);
  for(const id in all){ const p=all[id]; if(!p||!keep.has(p.position)) continue;
    const nm=p.full_name||((p.first_name||"")+" "+(p.last_name||"")).trim()||id;
    m[id]=[nm,p.position||"",p.team||""]; }
  lsSet(key,JSON.stringify({d:todayET(),m}));

function slpPlayer(id){
  const m=fant.players||{}; const p=m[id];
  if(p) return {name:p[0],pos:p[1],team:p[2]};
  if(/^[A-Z]{2,3}$/.test(String(id))) return {name:id+" D/ST",pos:"DEF",team:id};
  return {name:"Player "+id,pos:"",team:""};
}
function espnAbbr(t){ return ({WAS:"WSH",JAC:"JAX"})[t]||t; }
async function loadTeamStates(){
  try{
    const j=await fetchJSON("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
    const st={};
    (j.events||[]).forEach(ev=>{
      const comp=(ev.competitions&&ev.competitions[0])||{}; const type=(ev.status&&ev.status.type)||{};
      const cs=comp.competitors||[];
      let label;
      if(type.state==="in") label=(ev.status.type.shortDetail||("Q"+ev.status.period+" "+(ev.status.displayClock||"")));
      else if(type.state==="post") label="Final";
      else { try{ label=new Date(ev.date).toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit",timeZone:"America/New_York"}); }catch(_){ label=""; } }
      cs.forEach(c=>{ const ab=c.team&&c.team.abbreviation; if(!ab) return;
        const opp=cs.find(x=>x!==c); st[ab]={state:type.state,label,opp:(opp&&opp.team&&opp.team.abbreviation)||"",home:c.homeAway==="home"}; });
    });
    fant.teamState=st;
  }catch(_){}
}
async function loadFantasyMeta(){
  const state=await fetchJSON(SLP+"/state/nfl");
  fant.season=state.league_season||state.season; fant.week=state.display_week||state.week||1;
  const user=await fetchJSON(SLP+"/user/"+encodeURIComponent(sleeperName));
  if(!user||!user.user_id) throw new Error("nouser");
  fant.user=user;
  const leagues=await fetchJSON(SLP+"/user/"+user.user_id+"/leagues/nfl/"+fant.season);
  fant.leagues=(leagues||[]).filter(l=>l.status!=="pre_draft"&&l.status!=="drafting");
  const meta={};
  await Promise.all(fant.leagues.map(async l=>{
    try{
      const [rosters,users]=await Promise.all([fetchJSON(SLP+"/league/"+l.league_id+"/rosters"),fetchJSON(SLP+"/league/"+l.league_id+"/users")]);
      const mine=(rosters||[]).find(r=>r.owner_id===user.user_id||(r.co_owners||[]).includes(user.user_id));
      const um={}; (users||[]).forEach(u=>um[u.user_id]=u);
      meta[l.league_id]={rosters:rosters||[],users:um,myRosterId:mine?mine.roster_id:null};
    }catch(_){}
  }));
  fant.meta=meta; fant.metaAt=Date.now();
}
async function refreshFantasy(){
  if(!sleeperName||fant.busy) return; fant.busy=true;
  try{
    if(!fant.user||Date.now()-fant.metaAt>10*60*1000) await loadFantasyMeta();
    await Promise.all([loadSleeperPlayers().catch(()=>{}), loadTeamStates()]);
    const mu={};
    await Promise.all(fant.leagues.map(async l=>{ try{ mu[l.league_id]=await fetchJSON(SLP+"/league/"+l.league_id+"/matchups/"+fant.week); }catch(_){} }));
    fant.matchups=mu; fant.err=null; fant.loadedOnce=true; fant.updated=new Date();
  }catch(e){
    fant.err=(e&&e.message==="nouser")?"nouser":"net"; fant.loadedOnce=true;
  }finally{ fant.busy=false; renderFantasy(); }
}
function rosterName(lid,rid){

function fmtPts(n){ return (Math.round((+n||0)*100)/100).toFixed(2); }
function playerCell(id,pts,right){

function yetToPlay(starters){

function stillPlaying(starters){

function fantasyCard(l){
  const m=fant.meta[l.league_id]; const list=fant.matchups[l.league_id];
  if(!m||!m.myRosterId||!list) return '<div class="fx-card"><div class="fx-head"><div class="fx-league">'+esc(l.name)+'</div><div class="fx-meta"><span>No matchup found for week '+fant.week+'</span></div></div></div>';

  const opp=me.matchup_id!=null?list.find(x=>x.matchup_id===me.matchup_id&&x.roster_id!==me.roster_id):null;
  const myPts=me.custom_points!=null?me.custom_points:(me.points||0);
  const opPts=opp?(opp.custom_points!=null?opp.custom_points:(opp.points||0)):null;
  const slots=(l.roster_positions||[]).filter(s=>!NON_START.has(s));
  const n=Math.max(slots.length,(me.starters||[]).length,opp?(opp.starters||[]).length:0);

    const slot=SLOT_LABEL[slots[i]]||slots[i]||"";

  }
  const lead=opp?(myPts>opPts?"me":(opPts>myPts?"opp":"tie")):"me";
  const pct=opp&&(myPts+opPts)>0?Math.round(myPts/(myPts+opPts)*100):50;
  const startersSet=new Set(me.starters||[]);
  const bench=(me.players||[]).filter(id=>!startersSet.has(id));

    bench.map(id=>{ const p=slpPlayer(id); return '<div><span>'+esc(p.name)+' <span style="color:var(--ink3)">'+esc(p.pos+(p.team?" "+p.team:""))+'</span></span><b>'+fmtPts(pp[id])+'</b></div>'; }).join("")+'</div></details>':'';
  const myLeft=yetToPlay(me.starters), opLeft=opp?yetToPlay(opp.starters):0;
  const myLive=stillPlaying(me.starters), opLive=opp?stillPlaying(opp.starters):0;
  return '<div class="fx-card"><div class="fx-head"><div class="fx-league">'+esc(l.name)+' · Week '+fant.week+'</div>'+
    '<div class="fx-score"><div class="fx-team"><div class="fx-tname">'+esc(rosterName(l.league_id,me.roster_id))+'</div><div class="fx-rec">'+esc(rosterRec(l.league_id,me.roster_id))+'</div>'+
      '<div class="fx-pts'+(lead==="me"&&opp?" lead":"")+'">'+fmtPts(myPts)+'</div></div>'+
    '<span class="fx-vs">vs</span>'+
    (opp?'<div class="fx-team r"><div class="fx-tname">'+esc(rosterName(l.league_id,opp.roster_id))+'</div><div class="fx-rec">'+esc(rosterRec(l.league_id,opp.roster_id))+'</div>'+
      '<div class="fx-pts'+(lead==="opp"?" lead":"")+'">'+fmtPts(opPts)+'</div></div>':'<div class="fx-team r"><div class="fx-rec">No opponent this week</div></div>')+'</div>'+
    (opp?'<div class="fx-meter"><div style="width:'+pct+'%"></div></div>':'')+
    '<div class="fx-meta"><span>'+myLive+' playing · '+myLeft+' yet to play</span>'+(opp?'<span>'+opLive+' playing · '+opLeft+' yet to play</span>':'')+'</div></div>'+
    '<div class="fx-rows">'+rows+'</div>'+benchHTML+'</div>';
}

/* refresh — free public feeds only, no Claude usage. MLB is only polled when you have MLB legs. */
async function refresh(){
  if(busy) return; busy=true;
  if(!lastUpdated) setBanner("loading"); document.getElementById("refreshBtn").disabled=true;
  let matched=0, anyLoaded=false;
  try{
    playFeed=[]; extraGames={};
    const bySport={mlb:[],nfl:[],nba:[]};
    GAME_ORDER.forEach(label=>{ const sp=gameSport(label); (bySport[sp]=bySport[sp]||[]).push(label); });

    if(bySport.mlb.length){
      try{
        const sched=await loadMLBSchedule(EFFECTIVE_DATE); anyLoaded=true;
        const seenPks=new Set();
        for(const label of bySport.mlb){
          const sg=matchMLBGame(sched,GAME_META[label]); if(!sg) continue; matched++; seenPks.add(sg.gamePk);
          const st=sg.status&&sg.status.abstractGameState;
          if(st==="Preview"){ games[label]={state:"pregame",sport:"mlb"}; continue; }
          try{ const data=await fetchJSON(MLB_FEED_URL(sg.gamePk)); applyFeedMLB(label,data); render(); }catch(_){}
        }
        for(const sg of sched){
          if(seenPks.has(sg.gamePk)) continue;
          const st=sg.status&&sg.status.abstractGameState; if(st==="Preview") continue;
          try{
            const data=await fetchJSON(MLB_FEED_URL(sg.gamePk));
            const label=(sg.teams.away.team.name)+" @ "+(sg.teams.home.team.name);
            const ld=data.liveData||{}, ls=ld.linescore||{};
            const finalState=(data.gameData&&data.gameData.status&&data.gameData.status.abstractGameState)==="Final";
            extraGames[label]={state:finalState?"final":"live",sport:"mlb",
              awayScore:(ls.teams&&ls.teams.away&&ls.teams.away.runs)||0,
              homeScore:(ls.teams&&ls.teams.home&&ls.teams.home.runs)||0};
            buildPlayFeed(label,ld,buildPmap(ld));
          }catch(_){}
        }
        render();
      }catch(_){ /* MLB feed down — keep going with other sports */ }
    }
    for(const sport of ["nfl","nba"]){
      if(!bySport[sport].length) continue;
      const byDate={}; bySport[sport].forEach(l=>{ const d=gameDate(l); (byDate[d]=byDate[d]||[]).push(l); });
      for(const date of Object.keys(byDate)){
        let events=[];
        try{ events=await loadESPNSchedule(sport,date); anyLoaded=true; }catch(_){ continue; }
        for(const label of byDate[date]){
          const ev=matchESPNGame(events,GAME_META[label]); if(!ev) continue; matched++;
          const stateType=ev.status&&ev.status.type&&ev.status.type.state;
          if(stateType==="pre"){ games[label]={state:"pregame",sport:sport}; continue; }
          try{ const sum=await fetchJSON(espnSummaryUrl(sport,ev.id));
            if(sport==="nfl") applyFeedNFL(label,sum); else applyFeedNBA(label,sum);
            render();
          }catch(_){}
        }
      }
    }
    if(!anyLoaded) throw new Error("no feeds");
    playFeed.sort((a,b)=>a.ts<b.ts?1:(a.ts>b.ts?-1:0)); playFeed=playFeed.slice(0,150);
    lastUpdated=new Date(); setBanner(matched===0?"nodate":null); render(); scheduleNext();
  }catch(err){
    autoOn=false; stopTimers(); setBanner("offline"); render();
  }finally{ busy=false; document.getElementById("refreshBtn").disabled=false; if(sleeperName) refreshFantasy(); if(feedFilters.allnfl) refreshAllGames(); }
}
function scheduleNext(){ stopTimers(); if(!autoOn) return; nextAt=Date.now()+REFRESH_MS; timer=setTimeout(refresh,REFRESH_MS); ticker=setInterval(tickCountdown,1000); tickCountdown(); }
function stopTimers(){ clearTimeout(timer); clearInterval(ticker); }
function tickCountdown(){ const el=document.getElementById("countdown"); if(!autoOn){el.textContent="";return;} const s=Math.max(0,Math.round((nextAt-Date.now())/1000)); el.textContent="next in "+s+"s"; }

function setBanner(kind){
  const el=document.getElementById("banner");
  if(kind==="loading"){ el.innerHTML='<div class="note note-load"><span class="spin">↻</span> Updating…</div>'; }
  else if(kind==="offline"){ el.innerHTML='<div class="note note-error"><strong>Live data didn’t load here.</strong> Download this file (⋯ menu → Download) and open it in your browser — it runs free and live there, with no Claude usage.</div>'; }
  else if(kind==="nodate"){ el.innerHTML='<div class="note note-warn"><strong>No games found for '+EFFECTIVE_DATE+'.</strong> These bets may be from another day — paste today’s slip for a fresh board, or lock the slate date.</div>'; }
  else{ el.innerHTML=""; }
}

/* parlays */
function parlayState(p){
  const sts=p.legs.map(id=>(live[id]||{}).status);
  if(sts.includes("busted")) return {key:"dead",label:"Dead",fg:"#B42D45",bg:"#FBE8EC",dot:"#D03A52"};
  if(sts.every(s=>s==="cleared")) return {key:"won",label:"Won",fg:"#15784A",bg:"#E6F4EC",dot:"#1E9E5A"};
  const hit=sts.filter(s=>s==="cleared").length;
  return {key:"alive",label:"Alive · "+hit+"/"+sts.length,fg:"#1D4ED8",bg:"#E9F0FE",dot:"#2563EB"};
}
function parlayCard(p){
  const st=parlayState(p);
  const legs=p.legs.map(id=>{ const b=BETS.find(x=>x.id===id); if(!b) return ""; const l=live[id]||{}; const m=sm(l.status);
    return '<div class="pleg"><span class="dot" style="background:'+m.dot+'"></span><span class="pleg-name">'+esc(b.player)+
      ' <span>O'+b.line+' '+esc(propLabel(b.kind))+'</span></span><span class="pleg-st" style="color:'+m.fg+'">'+esc(m.label)+'</span></div>'; }).join("");
  return '<div class="parlay"><div class="parlay-top"><div><div class="parlay-name">'+esc(p.name)+'<span class="odds">'+esc(p.odds)+'</span></div>'+
    '<div class="parlay-money">'+money(p.wager)+' to pay '+money(p.payout)+'</div></div>'+
    '<span class="chip" style="background:'+st.bg+';color:'+st.fg+'"><span class="dot" style="background:'+st.dot+'"></span>'+esc(st.label)+'</span></div>'+
    '<div class="parlay-legs">'+legs+'</div></div>';
}

/* summary + cards */
function buildSummary(){
  const t=tally(BETS); const allClear=t.hit===BETS.length;
  let title;
  if(t.dead>0) title=t.dead+" leg"+(t.dead>1?"s":"")+" busted";
  else if(allClear) title="All legs cleared";
  else title=(BETS.length-t.hit)+" of "+BETS.length+" legs to go";
  const counts={}; BETS.forEach(b=>{ counts[b.kind]=(counts[b.kind]||0)+1; });
  const meta=Object.keys(counts).map(k=>counts[k]+" "+propLabel(k)).join(" · ")+" · "+GAME_ORDER.length+" games";
  const lg=(color,n,label)=>'<span class="lg"><span class="dot" style="background:'+color+'"></span>'+n+' '+label+'</span>';
  let legend=lg(STATUS.cleared.dot,t.hit,"cleared")+lg(STATUS.on_track.dot,t.liveN,"live")+lg(STATUS.pregame.dot,t.pend,"pregame");
  if(t.dead>0) legend+=lg(STATUS.busted.dot,t.dead,"busted");
  let sub="";
  if(PARLAYS.length){
    const risk=PARLAYS.reduce((a,p)=>a+p.wager,0); const ps=PARLAYS.map(parlayState);
    const won=ps.filter(s=>s.key==="won").length, dead=ps.filter(s=>s.key==="dead").length, alive=PARLAYS.length-won-dead;
    const winnings=PARLAYS.filter((p,i)=>ps[i].key==="won").reduce((a,p)=>a+p.payout,0);
    const live$=PARLAYS.filter((p,i)=>ps[i].key!=="dead").reduce((a,p)=>a+p.payout,0);
    sub='<div class="summary-sub">'+PARLAYS.length+' slips · '+money(risk)+' risked · '+alive+' alive, '+won+' won, '+dead+' dead'+
      (won?' · '+money(winnings)+' locked':'')+' · '+money(live$)+' still live</div>';
  }
  return '<div class="summary"><div class="summary-row">'+
    '<span class="summary-title">'+title+'</span><span class="summary-meta">'+meta+'</span></div>'+sub+
    '<div class="legend">'+legend+'</div></div>';
}
function sideText(b,short){
  if(b.kind==="any_td"&&b.line===0.5) return short?"Anytime TD":"Anytime TD"+(b.odds?(" · "+b.odds):"");
  if(short) return (b.side==="over"?"O":"U")+b.line+" "+propLabel(b.kind);
  return (b.side==="over"?"Over":"Under")+" "+b.line+" "+propName(b.kind)+(b.odds?(" · "+b.odds):"");
}
function legRow(b){
  const l=live[b.id], m=sm(l&&l.status); const n=slipsFor(b.id);
  const chip='<span class="chip" style="background:'+m.bg+';color:'+m.fg+'"><span class="dot" style="background:'+m.dot+'"></span>'+m.label+'</span>';
  const detail=l?(l.detail?'<span class="leg-detail">'+esc(l.detail)+'</span>':''):'<span class="leg-detail">awaiting update</span>';
  return '<div class="leg"><div class="leg-main"><div class="player">'+esc(b.player)+'</div>'+
    '<div class="prop">'+esc(sideText(b))+'</div>'+(n>1?'<div class="slips">on '+n+' slips</div>':'')+'</div>'+
    '<div class="leg-right">'+chip+detail+'</div></div>';
}
function fmtStart(s,game){
  const m=String(s).match(/(\d+):(\d+)\s*([ap])/i); let out=m?(m[1]+":"+m[2]+" "+(m[3].toLowerCase()==="a"?"AM":"PM")+" ET"):s;
  if(game && gameDate(game)!==EFFECTIVE_DATE){ try{ out=new Date(gameDate(game)+"T12:00:00").toLocaleDateString("en-US",{weekday:"short"})+" "+out; }catch(_){} }
  return out;
}
function buildPropsSidebar(){
  const sorted=BETS.slice().sort((a,b)=>{
    const ca=(live[a.id]||{}).status==="cleared"?1:0, cb=(live[b.id]||{}).status==="cleared"?1:0;
    if(ca!==cb) return ca-cb;
    return sortKey(a.game,a.start)<sortKey(b.game,b.start)?-1:1;
  });
  return sorted.map(b=>{
    const l=live[b.id]||{}; const st=sm(l.status);
    return '<div class="ps-item"><div class="ps-player">'+esc(b.player)+'</div>'+
      '<div class="ps-prop">'+esc(sideText(b,true))+' · '+esc(fmtStart(b.start,b.game))+'</div>'+
      '<div class="ps-row"><span class="ps-chip" style="background:'+st.bg+';color:'+st.fg+'">'+esc(st.label)+'</span>'+
      '<span class="ps-detail" title="'+esc(l.detail||"")+'">'+esc(l.detail||"")+'</span></div></div>';
  }).join("");
}
function myBetRow(b){
  const l=live[b.id]||{}; const st=sm(l.status); const n=slipsFor(b.id);
  const pct=b.line>0?Math.max(0,Math.min(100,Math.round(((l.current||0)/b.line)*100))):0;
  const showBar=(l.status!=="pregame");
  return '<div class="mybet-row"><div class="mybet-top">'+
    '<div class="mybet-main"><div class="player">'+esc(b.player)+'</div>'+
    '<div class="prop">'+esc(sideText(b))+'</div>'+
    '<div class="mybet-game">'+esc(b.game)+' · '+esc(fmtStart(b.start,b.game))+(n>1?' · on '+n+' slips':'')+'</div></div>'+
    '<div class="leg-right"><span class="chip" style="background:'+st.bg+';color:'+st.fg+'"><span class="dot" style="background:'+st.dot+'"></span>'+st.label+'</span>'+
    '<span class="leg-detail">'+esc(l.detail||"awaiting update")+'</span></div></div>'+
    (showBar?'<div class="mybet-bar"><div class="mybet-bar-fill" style="width:'+pct+'%;background:'+st.dot+'"></div></div>':'')+
    '</div>';
}
function buildMyBets(){
  let html="";
  if(PARLAYS.length){
    const order={alive:0,won:1,dead:2};
    const ps=PARLAYS.slice().sort((a,b)=>order[parlayState(a).key]-order[parlayState(b).key]);
    html+='<div class="section-label">Slips</div>'+ps.map(parlayCard).join("")+'<div class="section-label">Legs</div>';
  }
  const sorted=BETS.slice().sort((a,b)=>{
    const da=["cleared","busted"].includes((live[a.id]||{}).status)?1:0, db=["cleared","busted"].includes((live[b.id]||{}).status)?1:0;
    if(da!==db) return da-db;
    return sortKey(a.game,a.start)<sortKey(b.game,b.start)?-1:1;
  });
  return html+sorted.map(myBetRow).join("");
}
function basesSVG(g){
  const b=(g&&g.bases)||{}; const c=on=>on?"on":"";
  return '<svg class="diamond" width="30" height="30" viewBox="0 0 40 40">'+
    '<polygon points="20,36 34,20 20,4 6,20" fill="none" stroke="var(--line)" stroke-width="1.6"/>'+
    '<circle class="'+c(b.second)+'" cx="20" cy="4"  r="4.4" fill="'+(b.second?"var(--accent)":"var(--line2)")+'" stroke="var(--line)" stroke-width="1"/>'+
    '<circle class="'+c(b.third) +'" cx="6"  cy="20" r="4.4" fill="'+(b.third ?"var(--accent)":"var(--line2)")+'" stroke="var(--line)" stroke-width="1"/>'+
    '<circle class="'+c(b.first) +'" cx="34" cy="20" r="4.4" fill="'+(b.first ?"var(--accent)":"var(--line2)")+'" stroke="var(--line)" stroke-width="1"/>'+
    '</svg>';
}
function gameBar(game){
  const gs=games[game]||extraGames[game]||{state:"pregame"}; const legs=BETS.filter(b=>b.game===game);
  if(gs.state==="live"){
    const parts=[]; if(gs.inning) parts.push(esc(gs.inning));
    if(gs.balls!=null&&gs.strikes!=null) parts.push(gs.balls+"-"+gs.strikes);
    if(gs.outs!=null) parts.push(gs.outs+(gs.outs===1?" out":" outs"));
    return {live:true,final:false,score:(gs.awayScore!=null?gs.awayScore:0)+"–"+(gs.homeScore!=null?gs.homeScore:0),state:parts.join(" · ")};
  }
  if(gs.state==="final"){ return {live:false,final:true,score:(gs.awayScore!=null?gs.awayScore:"")+"–"+(gs.homeScore!=null?gs.homeScore:""),state:"Final"}; }
  return {live:false,final:false,score:null,state:"Starts "+fmtStart(legs[0]?legs[0].start:"",game)};
}
function gameCard(game){
  const legs=BETS.filter(b=>b.game===game); const open=getOpen(game); const bar=gameBar(game);
  const gs=games[game]||{}; const isMLB=(gs.sport||gameSport(game))==="mlb";
  const parts=game.split(" @ ");
  const teams='<span class="teams">'+(bar.live?'<span class="live-tag"><span class="ld pulse"></span>LIVE</span>':'')+esc(parts[0]||game)+'<span class="at">@</span>'+esc(parts[1]||"")+'</span>';
  const matchup=(bar.live && isMLB && gs.batter)?'<div class="matchup">At bat: '+esc(gs.batter)+(gs.pitcher?(' · Pitching: '+esc(gs.pitcher)):'')+'</div>':'';
  const minidots='<div class="minidots">'+legs.map(b=>'<span class="dot" style="background:'+sm((live[b.id]||{}).status).dot+'"></span>').join("")+'</div>';
  const score=bar.score!=null?'<span class="score'+(bar.final?" final":"")+'">'+bar.score+'</span>':'';
  const diamond=(bar.live && isMLB)?'<span class="diamond-wrap">'+basesSVG(gs)+'</span>':'';
  const chev='<span class="chev" style="transform:rotate('+(open?"180":"0")+'deg)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
  return '<div class="game"><button class="game-head" data-game="'+esc(game)+'">'+
    '<span class="gh-left">'+teams+'<div class="gstate">'+esc(bar.state)+'</div>'+matchup+minidots+'</span>'+
    diamond+score+chev+'</button>'+
    (open?'<div class="game-body">'+legs.map(legRow).join("")+'</div>':'')+'</div>';
}
function render(){
  const sub=document.getElementById("subline");
  if(lastUpdated){ sub.textContent="Updated "+lastUpdated.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" · tap a game to see your players."; }
  else{ sub.textContent="Pulling live stats…"; }
  const sc=document.getElementById("slatechip"); if(sc) sc.textContent=EFFECTIVE_DATE;
  document.getElementById("summary").innerHTML=buildSummary();
  document.getElementById("board").innerHTML=GAME_ORDER.map(gameCard).join("");
  updateExpandLabel();
  renderFantasy();
  document.getElementById("propsSidebar").innerHTML=buildPropsSidebar();
  document.getElementById("mybets").innerHTML=buildMyBets();
  const fe=document.getElementById("feed");
  const activeFeed=playFeed.filter(ev=>(ev.cats||["mine"]).some(c=>feedFilters[c]));
  const noFiltersOn=!feedFilters.mine&&!feedFilters.allnfl&&!feedFilters.hr&&!feedFilters.sb;
  const agHTML=feedFilters.allnfl?buildAllGamesHTML():"";
  const onlyAll=feedFilters.allnfl&&!feedFilters.mine&&!feedFilters.hr&&!feedFilters.sb;
  if(onlyAll){
    fe.innerHTML=agHTML;
  }else if(noFiltersOn){
    fe.innerHTML='<div class="feed-empty">No filters selected — turn on My Plays or All Games above to see the feed.</div>';
  }else if(activeFeed.length){
    if(feedSort==="recent"){
      fe.innerHTML=agHTML+'<div class="feed-flat">'+activeFeed.map(ev=>feedItemHTML(ev,true)).join("")+'</div>';
    }else{
      const grouped={}; activeFeed.forEach(ev=>{ (grouped[ev.game]=grouped[ev.game]||[]).push(ev); });
      const orderedGames=GAME_ORDER.filter(g=>grouped[g]&&grouped[g].length)
        .concat(Object.keys(grouped).filter(g=>!GAME_ORDER.includes(g)&&grouped[g].length));
      fe.innerHTML=agHTML+orderedGames.map(g=>{
        const bar=gameBar(g); const gp=games[g]||extraGames[g]||{}; const isMLB=(gp.sport||gameSport(g))==="mlb"; const parts=g.split(" @ ");
        const head='<div class="feed-group-head">'+
          '<span class="teams">'+(bar.live?'<span class="live-tag"><span class="ld pulse"></span>LIVE</span>':'')+esc(parts[0]||g)+'<span class="at">@</span>'+esc(parts[1]||"")+'</span>'+
          (bar.score!=null?'<span class="fg-score">'+bar.score+'</span>':'')+
          (bar.live&&isMLB?'<span class="diamond-wrap">'+basesSVG(gp)+'</span>':'')+'</div>';
        return '<div class="feed-group">'+head+'<div class="feed-group-body">'+grouped[g].map(ev=>feedItemHTML(ev,false)).join("")+'</div></div>';
      }).join("");
    }
  }else{
    fe.innerHTML=agHTML+'<div class="feed-empty">Nothing yet. Every play involving your players shows up here once their games are live.</div>';
  }
}
function feedItemHTML(ev,showGameTag){
  const badge=ev.live?{label:"LIVE",fg:"#1D4ED8",bg:"#E9F0FE"}:(ev.badgeOverride||eventBadge(ev.event));
  let chip;
  if(ev.betId!=null){
    const st=sm((live[ev.betId]||{}).status);
    chip='<span class="chip" style="background:'+st.bg+';color:'+st.fg+';padding:2px 8px;font-size:11px"><span class="dot" style="background:'+st.dot+'"></span>'+st.label+'</span>';
  }else if(ev.cats&&ev.cats.includes("hr")){
    chip='<span class="feed-badge-tag" style="background:#E6F4EC;color:#15784A">HR</span>';
  }else if(ev.cats&&ev.cats.includes("sb")){
    chip='<span class="feed-badge-tag" style="background:#FBF1DB;color:#946410">SB</span>';
  }else{ chip=''; }
  const time=relTime(ev.when);
  const tag=showGameTag?'<div class="feed-game-tag">'+esc(ev.game||"")+'</div>':'';
  return '<div class="feed-item"><span class="feed-badge'+(ev.live?" pulse":"")+'" style="background:'+badge.bg+';color:'+badge.fg+'">'+esc(badge.label)+'</span>'+
    '<div style="flex:1;min-width:0">'+tag+'<div class="feed-txt"><b>'+esc(ev.player)+'</b> — <span class="feed-event">'+esc(ev.event)+'</span>'+(ev.ctx?' · '+esc(ev.ctx):'')+'</div>'+
    (ev.line?'<div class="feed-sub">'+esc(ev.line)+'</div>':'')+'</div>'+
    '<div class="feed-item-right">'+chip+(time?'<span class="feed-time">'+time+'</span>':'')+'</div></div>';
}

/* events + boot */
if(!HAS_MLB){ document.querySelectorAll('#feedFilter button[data-filter="hr"],#feedFilter button[data-filter="sb"]').forEach(b=>b.style.display="none"); }
document.getElementById("board").addEventListener("click",e=>{ const h=e.target.closest(".game-head"); if(!h)return; const g=h.getAttribute("data-game"); const cur=getOpen(g); userSet[g]=true; openGames[g]=!cur; render(); });
document.getElementById("refreshBtn").addEventListener("click",()=>{ autoOn=true; refresh(); });
document.getElementById("expandBtn").addEventListener("click",()=>{ setAllOpen(!allExpanded()); });
document.getElementById("hdrToggle").addEventListener("click",()=>{
  const collapsed=document.body.classList.toggle("hdr-collapsed");
  const svg=document.getElementById("hdrToggle").querySelector("svg");
  svg.style.transform=collapsed?"rotate(180deg)":"rotate(0deg)";
  document.getElementById("hdrToggle").title=collapsed?"Expand header":"Minimize header";
});
(function(){
  const resizer=document.getElementById("colResizer");
  const sidebar=document.getElementById("propsSidebarWrap");
  let dragging=false,startX=0,startW=0;
  function clientX(e){ return e.touches?e.touches[0].clientX:e.clientX; }
  function onDown(e){ if(sidebar.classList.contains("col-collapsed")) return;
    dragging=true; startX=clientX(e); startW=sidebar.getBoundingClientRect().width;
    resizer.classList.add("dragging"); document.body.style.userSelect="none"; e.preventDefault(); }
  function onMove(e){ if(!dragging) return;
    const dx=clientX(e)-startX; let w=Math.round(startW-dx); w=Math.max(140,Math.min(420,w));
    sidebar.style.flexBasis=w+"px"; sidebar.style.width=w+"px"; e.preventDefault(); }
  function onUp(){ dragging=false; resizer.classList.remove("dragging"); document.body.style.userSelect=""; }
  resizer.addEventListener("mousedown",onDown);
  resizer.addEventListener("touchstart",onDown,{passive:false});
  window.addEventListener("mousemove",onMove);
  window.addEventListener("touchmove",onMove,{passive:false});
  window.addEventListener("mouseup",onUp);
  window.addEventListener("touchend",onUp);
})();
function toggleCol(elId,btnId){
  const el=document.getElementById(elId), btn=document.getElementById(btnId);
  const collapsing=!el.classList.contains("col-collapsed");
  if(elId==="propsSidebarWrap"){
    if(collapsing){ el.dataset.prevWidth=el.style.width||""; el.style.width=""; el.style.flexBasis=""; }
    else if(el.dataset.prevWidth){ el.style.width=el.dataset.prevWidth; el.style.flexBasis=el.dataset.prevWidth; }
  }
  el.classList.toggle("col-collapsed",collapsing);
  btn.querySelector("svg").style.transform=collapsing?"rotate(-90deg)":"rotate(0deg)";
  btn.title=(collapsing?"Expand ":"Collapse ")+(elId==="feedMain"?"plays":"props");
}
document.getElementById("feedColToggle").addEventListener("click",()=>toggleCol("feedMain","feedColToggle"));
document.getElementById("propsColToggle").addEventListener("click",()=>toggleCol("propsSidebarWrap","propsColToggle"));
document.getElementById("feedFilter").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
  const f=b.getAttribute("data-filter"); feedFilters[f]=!feedFilters[f];
  b.classList.toggle("is-active",feedFilters[f]); render();
  if(f==="allnfl"&&feedFilters.allnfl) refreshAllGames();
});
document.getElementById("feedSort").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return;
  feedSort=b.getAttribute("data-sort");
  document.querySelectorAll("#feedSort button").forEach(x=>x.classList.toggle("is-active",x===b));
  render();
});
document.getElementById("tabs").addEventListener("click",e=>{ const t=e.target.closest(".tab"); if(!t)return;
  activeTab=t.getAttribute("data-tab");
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("is-active",x.getAttribute("data-tab")===activeTab));
  document.getElementById("boardPane").style.display=activeTab==="board"?"block":"none";
  document.getElementById("mybetsPane").style.display=activeTab==="mybets"?"block":"none";
  document.getElementById("feedPane").style.display=activeTab==="feed"?"block":"none";
  document.getElementById("fantasyPane").style.display=activeTab==="fantasy"?"block":"none";
  if(activeTab==="fantasy" && sleeperName && !fant.loadedOnce) refreshFantasy();
});
render();
refresh();
</script>
