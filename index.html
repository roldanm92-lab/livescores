<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F4F6; --surface:#FFFFFF; --raised:#FAFBFC;
    --ink:#15181C; --ink2:#586069; --ink3:#98A0AA;
    --line:#E6E9ED; --line2:#EFF1F4; --accent:#5A52E0; --live:#D03A52;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 18px 72px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mark{font-family:Archivo,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .daynav{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
  .daynav button{border:0;background:none;cursor:pointer;color:var(--ink2);font:inherit;font-size:13px;width:24px;height:22px;border-radius:999px}
  .daynav button:hover{background:var(--raised);color:var(--ink)}
  .daynav span{font-size:12px;color:var(--ink2);padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .todaybtn{font-size:11.5px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
  .controls{display:flex;align-items:center;gap:8px}
  .caption{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .btn{font-family:Inter,sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px}
  .btn:hover{background:var(--raised)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#4A43C8}
  .lead{margin:8px 0 0;font-size:13px;color:var(--ink2)}

  .bar{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;gap:6px}
  .chipbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink3);padding:6px 13px;border-radius:999px}
  .chipbtn .fdot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35}
  .chipbtn.is-active{color:var(--ink);border-color:#DADEE3;background:var(--raised)}
  .chipbtn.is-active .fdot{opacity:1}
  .chipbtn[data-sport="nfl"].is-active{color:#15784A;border-color:#BFE3CE;background:#E6F4EC}
  .chipbtn[data-sport="nba"].is-active{color:#B4531A;border-color:#F1D2BC;background:#FCEFE6}
  .seg{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:0;background:none;color:var(--ink2);padding:5px 11px;border-radius:7px}
  .seg button:hover{color:var(--ink)}
  .seg button.is-active{background:var(--accent);color:#fff}
  .tabs{display:inline-flex;gap:4px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
  .tab{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:0;background:none;color:var(--ink2);padding:7px 16px;border-radius:8px}
  .tab.is-active{background:var(--accent);color:#fff}
  .tab .cnt{font-size:11px;opacity:.8;margin-left:4px}

  .note{margin-top:12px;padding:11px 14px;border-radius:11px;font-size:13.5px;border:1px solid}
  .note-load{background:var(--surface);border-color:var(--line);color:var(--ink2)}
  .note-error{background:#FBECEF;border-color:#F2CAD2;color:#9D2740}
  .empty{margin-top:10px;padding:22px 16px;text-align:center;color:var(--ink3);font-size:13.5px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}

  .sec{margin-top:22px}
  .sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
  .sec-title{font-family:Archivo,sans-serif;font-weight:800;font-size:17px}
  .sec-meta{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .sec-actions{margin-left:auto;display:flex;gap:6px}
  .link{font:inherit;font-size:12.5px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 4px}
  .link:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(20,24,28,.03);overflow:hidden;align-self:start}
  .card.is-tracked{border-color:#D4D1F7;box-shadow:0 0 0 1px #D4D1F7}
  .card.is-live{border-left:3px solid var(--live)}
  .c-main{padding:12px 14px;cursor:pointer}
  .c-main:hover{background:var(--raised)}
  .c-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .c-status{font-weight:600}
  .c-bc{color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .star{margin-left:auto;flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;padding:3px 8px;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink3)}
  .star:hover{border-color:#DADEE3;color:var(--ink2)}
  .star.on{color:var(--accent);border-color:#D4D1F7;background:#EEEDFC}
  .live-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--live)}
  .live-tag .ld{width:7px;height:7px;border-radius:50%;background:var(--live)}
  .teamrow{display:flex;align-items:center;gap:10px;margin-top:9px}
  .logo{width:26px;height:26px;object-fit:contain;flex-shrink:0}
  .logo-ph{width:26px;height:26px;border-radius:50%;background:var(--line2);flex-shrink:0}
  .tinfo{flex:1;min-width:0}
  .tname{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname.dim{color:var(--ink2)}
  .trec{font-size:11.5px;color:var(--ink3);font-weight:500;margin-left:6px;font-family:Inter,sans-serif}
  .pos{color:var(--accent);font-size:12px;margin-left:4px}
  .tscore{font-family:Archivo,sans-serif;font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
  .tscore.dim{color:var(--ink3)}
  .bump{animation:bump 1.6s ease-out}
  @keyframes bump{0%{color:var(--accent);transform:scale(1.18)}100%{transform:scale(1)}}
  .sit{margin-top:9px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .rz{font-size:10.5px;font-weight:700;color:#B42D45;background:#FBE8EC;padding:1px 6px;border-radius:5px}
  .lastplay{margin-top:7px;font-size:12.5px;color:var(--ink);line-height:1.4;padding-top:7px;border-top:1px solid var(--line2)}
  .lastplay .lbl{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.05em;margin-right:5px}
  .c-foot{margin-top:7px;font-size:11.5px;color:var(--ink3)}
  .c-body{border-top:1px solid var(--line2);padding:10px 14px 12px;background:var(--raised)}
  .ls{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
  .ls th{font-weight:600;color:var(--ink3);text-align:center;padding:3px 2px}
  .ls td{text-align:center;padding:3px 2px;color:var(--ink2)}
  .ls th:first-child,.ls td:first-child{text-align:left;font-weight:600;color:var(--ink)}
  .ls td:last-child{font-weight:700;color:var(--ink)}
  .sub-h{font-family:Archivo,sans-serif;font-weight:700;font-size:10.5px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin:11px 0 4px}
  .ldr{display:flex;gap:8px;font-size:12.5px;padding:2px 0}
  .ldr .cat{width:40px;flex-shrink:0;color:var(--ink3);font-weight:600;font-size:11px;padding-top:1px}
  .ldr .who{flex:1;min-width:0}
  .ldr .val{color:var(--ink2);font-variant-numeric:tabular-nums;text-align:right}
  .mini-play{display:flex;gap:8px;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--line2)}
  .mini-play:last-child{border-bottom:0}
  .mini-play .clk{color:var(--ink3);font-size:11px;white-space:nowrap;padding-top:2px;min-width:52px;font-variant-numeric:tabular-nums}

  .feed-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
  .feed-note{font-size:12px;color:var(--ink3)}
  .feed{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px}
  .feed-item{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line2);align-items:flex-start}
  .feed-item:last-child{border-bottom:0}
  .feed-item.scoring .feed-txt{font-weight:600}
  .feed-badge{margin-top:1px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:20px;
    padding:0 6px;border-radius:6px;font-family:Archivo,sans-serif;font-size:10.5px;font-weight:700}
  .feed-tag{font-size:11px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
  .feed-tag .sp{color:var(--ink2)}
  .feed-txt{font-size:13.5px;color:var(--ink)}
  .feed-sub{margin-top:2px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
  .feed-time{font-size:11px;color:var(--ink3);white-space:nowrap;margin-left:auto;padding-top:2px;font-variant-numeric:tabular-nums}
  .foot{margin-top:30px;font-size:11.5px;color:var(--ink3);text-align:center}
  .pulse{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .spin{display:inline-block;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.pulse,.spin,.bump{animation:none}}
  @media (max-width:480px){.mark{font-size:20px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark">Game Tracker</span>
      <span class="daynav"><button id="dayPrev" title="Previous day">‹</button><span id="dayLabel"></span><button id="dayNext" title="Next day">›</button></span>
      <button class="todaybtn" id="todayBtn" style="display:none">Back to today</button>
    </div>
    <div class="controls">
      <span id="countdown" class="caption"></span>
      <button id="refreshBtn" class="btn btn-primary">Refresh</button>
    </div>
  </header>
  <p class="lead" id="subline">Pulling live scores…</p>

  <div class="bar">
    <div class="chips" id="sportChips">
      <button class="chipbtn" data-sport="nfl"><span class="fdot"></span>NFL</button>
      <button class="chipbtn" data-sport="nba"><span class="fdot"></span>NBA</button>
    </div>
    <div class="seg" id="viewSeg">
      <button data-view="all">All games</button>
      <button data-view="tracked">Tracked <span id="trackedCount"></span></button>
    </div>
    <div class="seg" id="statusSeg">
      <button data-status="all">All</button>
      <button data-status="in">Live</button>
      <button data-status="pre">Upcoming</button>
      <button data-status="post">Final</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab is-active" data-tab="games">Games</button>
    <button class="tab" data-tab="plays">Live plays<span class="cnt" id="liveCnt"></span></button>
  </div>

  <div id="gamesPane"><div id="games"></div></div>
  <div id="playsPane" style="display:none">
    <div class="feed-tools">
      <div class="seg" id="playSeg">
        <button data-plays="all" class="is-active">Every play</button>
        <button data-plays="scoring">Scoring only</button>
      </div>
      <span class="feed-note" id="feedNote"></span>
    </div>
    <div id="plays"></div>
  </div>

  <p class="foot">Live data from ESPN’s free public scoreboard — refreshes every 30 seconds, no Claude usage. Tap a game for line score, leaders and recent plays. Tap ☆ Track to pin it.</p>
</div>

<script>
/* ===== config ===== */
const REFRESH_MS = 30000;
const SPORTS = {
  nfl:{label:"NFL", slug:"football/nfl"},
  nba:{label:"NBA", slug:"basketball/nba"},
};
/* bets get added later — this build is the scoreboard only */

/* ===== storage (safe) ===== */
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(_){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} }

/* ===== state ===== */
let sportsOn = lsGet("gt_sports",{nfl:true,nba:true});
let tracked  = new Set(lsGet("gt_tracked",[]));
let view     = lsGet("gt_view","all");          // all | tracked
let statusF  = lsGet("gt_status","all");        // all | in | pre | post
let playsMode= "all";                           // all | scoring
let activeTab= "games", dayOffset=0;
let events={nfl:[],nba:[]}, loaded={nfl:false,nba:false}, errs={nfl:null,nba:null};
let expanded={}, summaries={}, playLog={}, prevScores={}, bumped={};
let lastUpdated=null, busy=false, timer=null, ticker=null, nextAt=0;

/* ===== helpers ===== */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
async function fetchJSON(u){ const r=await fetch(u,{headers:{Accept:"application/json"}}); if(!r.ok) throw new Error("http "+r.status); return r.json(); }
function baseDateET(){ // 5am ET rollover so late West-coast games stay on "today"
  try{ return new Date(Date.now()-5*3600e3).toLocaleDateString("en-CA",{timeZone:"America/New_York"}); }catch(_){ return new Date().toISOString().slice(0,10); } }
function slateDate(){ const [y,m,d]=baseDateET().split("-").map(Number); return new Date(Date.UTC(y,m-1,d+dayOffset)).toISOString().slice(0,10); }
function dayLabel(d){ return new Date(d+"T12:00:00Z").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"}); }
function startET(iso){ try{ return new Date(iso).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/New_York"})+" ET"; }catch(_){ return ""; } }
function relTime(t){ if(!t) return ""; const m=Math.round((Date.now()-t)/60000); if(m<1) return "just now"; if(m<60) return m+"m ago"; return Math.round(m/60)+"h ago"; }
function periodLabel(i){ return i<4?String(i+1):(i===4?"OT":(i-3)+"OT"); }
function sbURL(s,d){ return "https://site.api.espn.com/apis/site/v2/sports/"+SPORTS[s].slug+"/scoreboard?dates="+d.replace(/-/g,""); }
function sumURL(s,id){ return "https://site.api.espn.com/apis/site/v2/sports/"+SPORTS[s].slug+"/summary?event="+id; }
function saveTracked(){ lsSet("gt_tracked",[...tracked]); }

/* ===== parse ESPN scoreboard event ===== */
function parseTeam(c){
  if(!c) return {id:"",abbr:"",name:"",logo:"",score:null,rec:"",ls:[],leaders:[]};
  const t=c.team||{};
  return { id:String(t.id||c.id||""), abbr:t.abbreviation||"", name:t.shortDisplayName||t.displayName||t.name||"",
    logo:t.logo||"", score:(c.score!=null&&c.score!=="")?c.score:null,
    rec:(c.records&&c.records[0]&&c.records[0].summary)||"",
    ls:(c.linescores||[]).map(x=>x.displayValue!=null?x.displayValue:x.value), leaders:c.leaders||[] };
}
function parseEvent(ev,sport){
  const comp=(ev.competitions&&ev.competitions[0])||{}; const st=comp.status||ev.status||{}; const type=st.type||{};
  const cs=comp.competitors||[];
  const sit=comp.situation||{}; const lp=sit.lastPlay||{};
  let bc=""; try{ bc=(comp.broadcasts||[]).map(b=>(b.names||[]).join("/")).filter(Boolean).join(", ");
    if(!bc) bc=(comp.geoBroadcasts||[]).map(b=>b.media&&b.media.shortName).filter(Boolean).join(", "); }catch(_){}
  return { id:String(ev.id), sport, date:ev.date, state:type.state||"pre",
    detail:type.shortDetail||type.detail||"", period:st.period||0, clock:st.displayClock||"",
    away:parseTeam(cs.find(c=>c.homeAway==="away")), home:parseTeam(cs.find(c=>c.homeAway==="home")),
    bc, odds:(comp.odds&&comp.odds[0]&&comp.odds[0].details)||"", venue:(comp.venue&&comp.venue.fullName)||"",
    leaders:comp.leaders||[],
    sit:{ dd:sit.downDistanceText||sit.shortDownDistanceText||"", pos:String(sit.possession||""), rz:!!sit.isRedZone,
      last:lp.text||"", lastId:String(lp.id||""), lastType:(lp.type&&lp.type.text)||"" } };
}

/* ===== plays ===== */
function extractPlays(sum,sport){
  let arr=[];
  if(sport==="nba") arr=sum.plays||[];
  else{ const d=sum.drives||{}; (d.previous||[]).forEach(dr=>(dr.plays||[]).forEach(p=>arr.push(p)));
    if(d.current&&d.current.plays) d.current.plays.forEach(p=>arr.push(p)); }
  const seen={}, out=[];
  arr.forEach((p,i)=>{ const id=String(p.id||p.sequenceNumber||i); if(seen[id]) return; seen[id]=1;
    out.push({ id, text:p.text||"", period:(p.period&&p.period.number)||0, clock:(p.clock&&p.clock.displayValue)||"",
      scoring:!!p.scoringPlay, type:(p.type&&p.type.text)||"", wall:p.wallclock?Date.parse(p.wallclock):null,
      a:p.awayScore, h:p.homeScore, seq:i }); });
  return out;
}
function addToLog(g,p){
  if(!p.text) return; const k=g.id+"|"+p.id;
  if(playLog[k]){ Object.assign(playLog[k],{scoring:p.scoring||playLog[k].scoring}); return; }
  playLog[k]=Object.assign({gid:g.id,sport:g.sport,seen:Date.now()},p);
}
function ingestLastPlays(list){
  list.forEach(g=>{ if(g.state==="in" && g.sit.last){
    addToLog(g,{id:g.sit.lastId||("lp"+g.sit.last.length+g.sit.last.slice(0,40)),text:g.sit.last,type:g.sit.lastType,
      period:g.period,clock:g.clock,scoring:/touchdown|field goal is good|makes/i.test(g.sit.last)&&!/no play|misses/i.test(g.sit.last),
      wall:null,a:g.away.score,h:g.home.score,seq:0}); } });
}
async function loadSummary(g){
  try{ const sum=await fetchJSON(sumURL(g.sport,g.id)); const plays=extractPlays(sum,g.sport);
    summaries[g.id]={plays,at:Date.now()}; plays.slice(-40).forEach(p=>addToLog(g,p)); }catch(_){}
}
function badge(p,sport){
  const t=((p.type||"")+" "+(p.text||"")).toLowerCase();
  const G={fg:"#15784A",bg:"#E6F4EC"}, R={fg:"#B42D45",bg:"#FBE8EC"}, B={fg:"#1D4ED8",bg:"#E9F0FE"}, A={fg:"#946410",bg:"#FBF1DB"}, N={fg:"#586069",bg:"#EFF1F4"};
  const b=(l,c)=>Object.assign({label:l},c);
  if(sport==="nfl"){
    if(/no play/.test(t)&&/penalty/.test(t)) return b("PEN",A);
    if(/touchdown/.test(t)) return b("TD",G);
    if(/field goal (is )?good/.test(t)) return b("FG",G);
    if(/field goal/.test(t)) return b("FG X",R);
    if(/extra point|two-point|2pt/.test(t)) return b("PAT",G);
    if(/safety/.test(t)) return b("SAF",A);
    if(/intercept/.test(t)) return b("INT",R);
    if(/fumble/.test(t)) return b("FUM",R);
    if(/sack/.test(t)) return b("SACK",R);
    if(/punt/.test(t)) return b("PUNT",N);
    if(/kickoff|kicks \d+ yards/.test(t)) return b("KO",N);
    if(/penalty/.test(t)) return b("PEN",A);
    if(/timeout/.test(t)) return b("TO",N);
    if(/incomplete/.test(t)) return b("INC",N);
    if(/\bpass\b/.test(t)) return b("PASS",B);
    if(/rush|left|right|middle|scrambles|kneels/.test(t)) return b("RUSH",B);
    if(/end of|two-minute/.test(t)) return b("END",N);
    return b("PLAY",N);
  }
  if(/blocks/.test(t)) return b("BLK",B);
  if(/turnover|bad pass|traveling|offensive foul|lost ball|steals/.test(t)) return b("TO",R);
  if(/misses/.test(t)) return b("MISS",N);
  if(/makes/.test(t)&&/three point/.test(t)) return b("3PT",G);
  if(/makes/.test(t)&&/free throw/.test(t)) return b("FT",G);
  if(/makes/.test(t)) return b("FG",G);
  if(/rebound/.test(t)) return b("REB",B);
  if(/foul/.test(t)) return b("FOUL",A);
  if(/enters the game|substitution/.test(t)) return b("SUB",N);
  if(/timeout/.test(t)) return b("TMO",N);
  if(/end of|start of/.test(t)) return b("END",N);
  return b("•",N);
}

/* ===== selection ===== */
function activeSports(){ return Object.keys(SPORTS).filter(s=>sportsOn[s]); }
const ORDER={in:0,pre:1,post:2};
function sortGames(a,b){ return (ORDER[a.state]-ORDER[b.state]) || (a.date<b.date?-1:a.date>b.date?1:0); }
function inView(g){ return view==="all" || tracked.has(g.id); }
function shownGames(s){ return events[s].filter(g=>inView(g)&&(statusF==="all"||g.state===statusF)).sort(sortGames); }
function viewGamesAll(){ return activeSports().flatMap(s=>events[s].filter(inView)); }
function findGame(id){ for(const s in events){ const g=events[s].find(x=>x.id===id); if(g) return g; } return null; }

/* ===== refresh ===== */
async function refresh(){
  if(busy) return; busy=true; $("refreshBtn").disabled=true;
  const d=slateDate(); const sports=activeSports();
  await Promise.all(sports.map(async s=>{
    try{ const j=await fetchJSON(sbURL(s,d)); events[s]=(j.events||[]).map(ev=>parseEvent(ev,s)); errs[s]=null; ingestLastPlays(events[s]); }
    catch(e){ errs[s]=e; }
    loaded[s]=true;
  }));
  // score-change flashes
  bumped={}; sports.forEach(s=>events[s].forEach(g=>{ ["away","home"].forEach(side=>{ const k=g.id+side, v=g[side].score;
    if(prevScores[k]!=null && v!=null && String(prevScores[k])!==String(v)) bumped[k]=1; prevScores[k]=v; }); }));
  // summaries: expanded cards, plus every live game in view while the Live plays tab is open
  const need=viewGamesAll().filter(g=>g.state!=="pre" && (
    (expanded[g.id] && (g.state==="in"||!summaries[g.id])) || (activeTab==="plays" && g.state==="in")));
  await Promise.all(need.slice(0,24).map(loadSummary));
  lastUpdated=new Date(); busy=false; $("refreshBtn").disabled=false;
  render(); scheduleNext();
}
function scheduleNext(){ stopTimers(); nextAt=Date.now()+REFRESH_MS;
  timer=setTimeout(()=>{ if(document.hidden){ scheduleNext(); return; } refresh(); },REFRESH_MS);
  ticker=setInterval(tick,1000); tick(); }
function stopTimers(){ clearTimeout(timer); clearInterval(ticker); }
function tick(){ $("countdown").textContent=document.hidden?"paused":"next in "+Math.max(0,Math.round((nextAt-Date.now())/1000))+"s"; }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && lastUpdated && Date.now()-lastUpdated>REFRESH_MS) refresh(); });

/* ===== render: games ===== */
function teamRow(g,side){
  const t=g[side], o=g[side==="away"?"home":"away"];
  const started=g.state!=="pre";
  const lead=started && t.score!=null && o.score!=null && (+t.score>=+o.score);
  const dim=g.state==="post" && !lead;
  const pos=(g.sport==="nfl"&&g.state==="in"&&g.sit.pos&&g.sit.pos===t.id)?'<span class="pos" title="Possession">●</span>':'';
  const logo=t.logo?'<img class="logo" src="'+esc(t.logo)+'" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'logo-ph\'}))">':'<span class="logo-ph"></span>';
  return '<div class="teamrow">'+logo+'<div class="tinfo"><span class="tname'+(dim?" dim":"")+'">'+esc(t.name||t.abbr)+pos+
    (t.rec?'<span class="trec">'+esc(t.rec)+'</span>':'')+'</span></div>'+
    (started?'<span class="tscore'+(dim?" dim":"")+(bumped[g.id+side]?" bump":"")+'">'+esc(t.score==null?"–":t.score)+'</span>':'')+'</div>';
}
function statusHTML(g){
  if(g.state==="in") return '<span class="live-tag"><span class="ld pulse"></span>LIVE</span><span class="c-status">'+esc(g.detail)+'</span>';
  if(g.state==="post") return '<span class="c-status">'+esc(g.detail||"Final")+'</span>';
  const t=/postponed|canceled|delayed|suspended/i.test(g.detail)?g.detail:startET(g.date);
  return '<span class="c-status">'+esc(t)+'</span>';
}
function leadersHTML(g){
  const rows=[]; const abbrOf=id=>id==null?"":(String(id)===g.away.id?g.away.abbr:(String(id)===g.home.id?g.home.abbr:""));
  const add=(grp,abbr)=>{ const l=(grp.leaders||[])[0]; if(!l) return; const a=l.athlete||{};
    rows.push('<div class="ldr"><span class="cat">'+esc(grp.shortDisplayName||grp.abbreviation||grp.displayName||"")+'</span><span class="who">'+
      esc(a.shortName||a.displayName||"")+' <span style="color:var(--ink3)">'+esc(abbr||abbrOf(a.team&&a.team.id)||abbrOf(l.team&&l.team.id))+'</span></span><span class="val">'+esc(l.displayValue||"")+'</span></div>'); };
  (g.leaders||[]).slice(0,3).forEach(grp=>add(grp,null));
  [g.away,g.home].forEach(t=>(t.leaders||[]).filter(x=>!/rating/i.test(x.name||"")).slice(0,3).forEach(grp=>add(grp,t.abbr)));
  return rows.length?'<div class="sub-h">'+(g.state==="pre"?"Season leaders":"Leaders")+'</div>'+rows.join(""):"";
}
function lineScoreHTML(g){
  const n=Math.max(g.away.ls.length,g.home.ls.length); if(!n) return "";
  let h='<table class="ls"><tr><th></th>'; for(let i=0;i<n;i++) h+='<th>'+periodLabel(i)+'</th>'; h+='<th>T</th></tr>';
  [g.away,g.home].forEach(t=>{ h+='<tr><td>'+esc(t.abbr)+'</td>'; for(let i=0;i<n;i++) h+='<td>'+esc(t.ls[i]!=null?t.ls[i]:"")+'</td>'; h+='<td>'+esc(t.score==null?"":t.score)+'</td></tr>'; });
  return h+'</table>';
}
function recentPlaysHTML(g){
  const s=summaries[g.id]; if(!s) return g.state==="pre"?"":'<div class="sub-h">Recent plays</div><div class="feed-note"><span class="spin">↻</span> loading…</div>';
  const list=s.plays.filter(p=>p.text).slice(-6).reverse(); if(!list.length) return "";
  return '<div class="sub-h">Recent plays</div>'+list.map(p=>{ const bd=badge(p,g.sport);
    return '<div class="mini-play"><span class="feed-badge" style="background:'+bd.bg+';color:'+bd.fg+'">'+esc(bd.label)+'</span><span style="flex:1">'+esc(p.text)+'</span><span class="clk">'+esc((p.period?"Q"+p.period+" ":"")+p.clock)+'</span></div>'; }).join("");
}
function card(g){
  const on=tracked.has(g.id), open=!!expanded[g.id];
  let sit="";
  if(g.state==="in" && g.sport==="nfl" && (g.sit.dd||g.sit.rz)) sit='<div class="sit">'+(g.sit.dd?'<span>'+esc(g.sit.dd)+'</span>':'')+(g.sit.rz?'<span class="rz">RED ZONE</span>':'')+'</div>';
  const last=(g.state==="in"&&g.sit.last)?'<div class="lastplay"><span class="lbl">LAST</span>'+esc(g.sit.last.length>170?g.sit.last.slice(0,167)+"…":g.sit.last)+'</div>':'';
  const foot=g.state==="pre"?[g.odds,g.venue].filter(Boolean).join(" · "):"";
  return '<div class="card'+(on?" is-tracked":"")+(g.state==="in"?" is-live":"")+'">'+
    '<div class="c-main" data-expand="'+esc(g.id)+'">'+
      '<div class="c-top">'+statusHTML(g)+(g.bc?'<span class="c-bc">· '+esc(g.bc)+'</span>':'')+
        '<button class="star'+(on?" on":"")+'" data-track="'+esc(g.id)+'" title="'+(on?"Stop tracking":"Track this game")+'">'+(on?"★ Tracking":"☆ Track")+'</button></div>'+
      teamRow(g,"away")+teamRow(g,"home")+sit+last+(foot?'<div class="c-foot">'+esc(foot)+'</div>':'')+
    '</div>'+
    (open?'<div class="c-body">'+lineScoreHTML(g)+leadersHTML(g)+recentPlaysHTML(g)+(g.state==="pre"&&!g.leaders.length&&!g.away.leaders.length?'<div class="feed-note">Details appear once the game starts.</div>':'')+'</div>':'')+
  '</div>';
}
function renderGames(){
  const el=$("games"), sports=activeSports();
  if(!sports.length){ el.innerHTML='<div class="empty">Pick NFL, NBA, or both above.</div>'; return; }
  el.innerHTML=sports.map(s=>{
    const L=SPORTS[s].label, all=events[s];
    const liveN=all.filter(g=>g.state==="in").length, tN=all.filter(g=>tracked.has(g.id)).length;
    const head='<div class="sec-head"><span class="sec-title">'+L+'</span>'+
      (loaded[s]?'<span class="sec-meta">'+all.length+' game'+(all.length===1?"":"s")+' · '+liveN+' live · '+tN+' tracked</span>':'')+
      (all.length?'<span class="sec-actions"><button class="link" data-trackall="'+s+'">Track all</button><button class="link" data-clear="'+s+'">Clear</button></span>':'')+'</div>';
    let body;
    if(!loaded[s]) body='<div class="note note-load"><span class="spin">↻</span> Loading '+L+' games…</div>';
    else if(errs[s]&&!all.length) body='<div class="note note-error"><strong>'+L+' scores didn’t load.</strong> Open this page in a normal browser (or the GitHub Pages link). It’ll retry on the next refresh.</div>';
    else if(!all.length) body='<div class="empty">No '+L+' games on '+esc(dayLabel(slateDate()))+'.</div>';
    else{ const list=shownGames(s);
      body=list.length?'<div class="grid">'+list.map(card).join("")+'</div>':
        '<div class="empty">'+(view==="tracked"&&!tN?'No '+L+' games tracked yet — tap “Track all” or switch to All games and tap ☆ Track.':'No '+({in:"live",pre:"upcoming",post:"final"}[statusF]||"")+' '+L+' games in this view.')+'</div>'; }
    return '<section class="sec">'+head+body+'</section>';
  }).join("");
}

/* ===== render: live plays ===== */
function renderPlays(){
  const el=$("plays"); const games=viewGamesAll(); const ids=new Set(games.map(g=>g.id));
  const liveG=games.filter(g=>g.state==="in");
  $("feedNote").textContent=liveG.length?("Following "+liveG.length+" live game"+(liveG.length===1?"":"s")+(view==="tracked"?" (tracked only)":"")):"";
  let items=Object.values(playLog).filter(p=>ids.has(p.gid)&&(playsMode==="all"||p.scoring));
  items.sort((a,b)=>((b.wall||b.seen)-(a.wall||a.seen))||(b.seq-a.seq));
  items=items.slice(0,150);
  if(!items.length){
    let msg=!activeSports().length?"Pick NFL, NBA, or both above.":
      (view==="tracked"&&!games.length?"No tracked games — track some on the Games tab, or switch to All games.":
      (liveG.length?'<span class="spin">↻</span> Pulling plays…':"No games live in your selection right now."));
    const next=games.filter(g=>g.state==="pre").sort(sortGames)[0];
    if(!liveG.length&&next) msg+=" Next up: "+esc(next.away.abbr+" @ "+next.home.abbr)+" at "+esc(startET(next.date))+".";
    el.innerHTML='<div class="empty">'+msg+'</div>'; return;
  }
  el.innerHTML='<div class="feed">'+items.map(p=>{
    const g=findGame(p.gid); const bd=badge(p,p.sport);
    const tag=g?('<span class="sp">'+SPORTS[p.sport].label+'</span> · '+esc(g.away.abbr+" @ "+g.home.abbr)+(p.period?" · Q"+p.period:"")+(p.clock?" "+esc(p.clock):"")):"";
    const sc=(p.a!=null&&p.h!=null&&g)?esc(g.away.abbr+" "+p.a+" – "+g.home.abbr+" "+p.h):"";
    return '<div class="feed-item'+(p.scoring?" scoring":"")+'"><span class="feed-badge" style="background:'+bd.bg+';color:'+bd.fg+'">'+esc(bd.label)+'</span>'+
      '<div style="flex:1;min-width:0"><div class="feed-tag">'+tag+'</div><div class="feed-txt">'+esc(p.text)+'</div>'+(sc?'<div class="feed-sub">'+sc+'</div>':'')+'</div>'+
      '<span class="feed-time">'+relTime(p.wall||p.seen)+'</span></div>';
  }).join("")+'</div>';
}

function render(){
  $("subline").textContent=lastUpdated?("Updated "+lastUpdated.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+" · tap a game for details"):"Pulling live scores…";
  $("dayLabel").textContent=dayOffset===0?"Today · "+dayLabel(slateDate()):dayLabel(slateDate());
  $("todayBtn").style.display=dayOffset===0?"none":"inline";
  document.querySelectorAll("#sportChips .chipbtn").forEach(b=>b.classList.toggle("is-active",!!sportsOn[b.dataset.sport]));
  document.querySelectorAll("#viewSeg button").forEach(b=>b.classList.toggle("is-active",b.dataset.view===view));
  document.querySelectorAll("#statusSeg button").forEach(b=>b.classList.toggle("is-active",b.dataset.status===statusF));
  document.querySelectorAll("#playSeg button").forEach(b=>b.classList.toggle("is-active",b.dataset.plays===playsMode));
  const tN=activeSports().reduce((a,s)=>a+events[s].filter(g=>tracked.has(g.id)).length,0);
  $("trackedCount").textContent=tN?"("+tN+")":"";
  const liveN=viewGamesAll().filter(g=>g.state==="in").length;
  $("liveCnt").textContent=liveN?" · "+liveN:"";
  $("gamesPane").style.display=activeTab==="games"?"block":"none";
  $("playsPane").style.display=activeTab==="plays"?"block":"none";
  renderGames(); renderPlays();
}

/* ===== events ===== */
document.addEventListener("click",e=>{
  const tr=e.target.closest("[data-track]");
  if(tr){ e.stopPropagation(); const id=tr.dataset.track; tracked.has(id)?tracked.delete(id):tracked.add(id); saveTracked(); render(); return; }
  const ta=e.target.closest("[data-trackall]"); if(ta){ events[ta.dataset.trackall].forEach(g=>tracked.add(g.id)); saveTracked(); render(); return; }
  const cl=e.target.closest("[data-clear]"); if(cl){ events[cl.dataset.clear].forEach(g=>tracked.delete(g.id)); saveTracked(); render(); return; }
  const ex=e.target.closest("[data-expand]");
  if(ex){ const id=ex.dataset.expand; expanded[id]=!expanded[id]; render();
    const g=findGame(id); if(expanded[id]&&g&&g.state!=="pre"&&!summaries[id]) loadSummary(g).then(render); return; }
  const sp=e.target.closest("#sportChips .chipbtn");
  if(sp){ const s=sp.dataset.sport; sportsOn[s]=!sportsOn[s]; lsSet("gt_sports",sportsOn); render(); if(sportsOn[s]&&!loaded[s]) refresh(); return; }
  const vw=e.target.closest("#viewSeg button"); if(vw){ view=vw.dataset.view; lsSet("gt_view",view); render(); return; }
  const stb=e.target.closest("#statusSeg button"); if(stb){ statusF=stb.dataset.status; lsSet("gt_status",statusF); render(); return; }
  const pm=e.target.closest("#playSeg button"); if(pm){ playsMode=pm.dataset.plays; render(); return; }
  const tb=e.target.closest(".tab");
  if(tb){ activeTab=tb.dataset.tab; document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("is-active",x===tb)); render();
    if(activeTab==="plays") refresh(); return; }
});
function changeDay(delta){ dayOffset=delta===0?0:dayOffset+delta; events={nfl:[],nba:[]}; loaded={nfl:false,nba:false};
  expanded={}; summaries={}; playLog={}; prevScores={}; render(); refresh(); }
$("dayPrev").onclick=()=>changeDay(-1);
$("dayNext").onclick=()=>changeDay(1);
$("todayBtn").onclick=()=>changeDay(0);
$("refreshBtn").onclick=()=>refresh();

render(); refresh();
</script>
</body>
</html>
